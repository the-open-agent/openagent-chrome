<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenAgent Browser Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>OpenAgent Browser Bridge</h1>
    <label>
      OpenAgent URL
      <input id="serverUrl" type="text" placeholder="http://127.0.0.1:14000">
    </label>
    <label>
      Token
      <input id="token" type="password" placeholder="Optional">
    </label>
    <div id="status" class="status">Disconnected</div>
    <div class="actions">
      <button id="connect" type="button">Connect</button>
      <button id="disconnect" type="button">Disconnect</button>
    </div>
    <p class="hint">Connect this extension, then select OpenAgent Chrome Extension mode in Browser Use.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
